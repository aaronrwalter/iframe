            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 600px;
            border: 1px solid black;
            text-align: center;
            font-size: 50;
        }
        .header,.footer{
            height: 20%;
            background-color: rgb(69, 136, 136);
        }
        .center{
            height: 60%;
            background-color: blanchedalmond;
            display: flex;
        }
        .left{
            height: 100%;
            width: 20%;
            background-color: lightcoral;
        }
        .right{
            height: 100%;
            width: 80%;
            background-color: lightskyblue;
        }
        .top{
            height: 50%;
            background-color: blanchedalmond;
        }
        .down{
            height: 50%;
            background-color: cyan;
            display: flex;
        }
        .b1{
            width: 50%;
            height: 100%;
            background-color: lightgray;
        }
        .b2{
            width: 50%;
            height: 100%;
            background-color: lightpink
            ;

        }
    </style>
</head>
<body>
    <h1 align="center">FLEX BOX</h1>
    <div>
        <div class="container">
            <div class="header"></div>
            <div class="center">
                <div class="left"></div>
                <div class="right">
                    <div class="top"></div>
                    <div class="down">
                        <div class="b1"></div>
                        <div class="b2"></div>
                    </div>
                </div>
            </div>
            <div class="footer"></div>
        </div>
    </div>
</body>
</html>
